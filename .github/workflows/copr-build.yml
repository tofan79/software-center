name: COPR build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    permissions:
      contents: read

    steps:
      - name: Install packaging tools
        run: dnf -y install git rpm-build copr-cli

      - name: Validate version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH_TAG" ]; then
              raw="$DISPATCH_TAG"
            else
              raw="$(git ls-remote --tags https://github.com/tofan79/software-center.git \
                     | sed -n 's#.*refs/tags/\(v[0-9][^[:space:]]*\).*#\1#p' \
                     | sort -V | tail -n1)"
            fi
          else
            raw="$TAG"
          fi
          version="${raw#v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+~]*)
              echo "::error::Unexpected version string: '${version}'"
              exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Configure COPR credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$COPR_CONFIG" ]; then
            echo "::error::COPR_API_TOKEN secret is empty; copy the token block from https://copr.fedorainfracloud.org/api/."
            exit 1
          fi
          mkdir -p "${HOME}/.config"
          printf '%s' "$COPR_CONFIG" > "${HOME}/.config/copr"
          chmod 600 "${HOME}/.config/copr"

      - name: Build source RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f resources/software-center.spec ]; then
            echo "::error::resources/software-center.spec missing in this checkout."
            exit 1
          fi
          mkdir -p "${HOME}/rpmbuild/SOURCES" "${HOME}/rpmbuild/SPECS"
          # Tarball prefix must match %{name}-%{version} used by %autosetup.
          git archive --prefix="software-center-${VERSION}/" HEAD \
            | gzip -9 > "${HOME}/rpmbuild/SOURCES/software-center-${VERSION}.tar.gz"
          sed '/^%changelog/q' resources/software-center.spec > "${HOME}/rpmbuild/SPECS/software-center.spec"
          sed -i "s/^Version:.*/Version: ${VERSION}/" "${HOME}/rpmbuild/SPECS/software-center.spec"
          rpmbuild -bs "${HOME}/rpmbuild/SPECS/software-center.spec" --define "_topdir ${HOME}/rpmbuild"
          srpm=$(find "${HOME}/rpmbuild/SRPMS" -name "software-center-${VERSION}-1*.src.rpm" | head -n1)
          if [ -z "$srpm" ]; then
            echo "::error::Source RPM was not produced."
            exit 1
          fi
          echo "SRPM=${srpm}" >> "$GITHUB_ENV"

      - name: Submit build to COPR
        env:
          PROJECT: mindset/Mindset-Apps
        run: |
          set -euo pipefail
          copr-cli build "$PROJECT" "$SRPM"
