[workspace]
members = [
    "crates/backend/appstream",
    "crates/backend/flatpak",
    "crates/backend/packages",
    "crates/backend/updates",
    "crates/backend/appimages",
    "crates/backend/home",
    "crates/ui-qt",
    "crates/daemon",
]
resolver = "2"

[workspace.package]
version = "1.0.10"
authors = ["mindset"]
license = "GPL-3.0-or-later"
edition = "2021"

[workspace.dependencies]
# Backend shared deps
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# Backend crates (used by UI crates)
scenter-appstream = { path = "crates/backend/appstream" }
scenter-flatpak   = { path = "crates/backend/flatpak" }
scenter-packages  = { path = "crates/backend/packages" }
scenter-updates   = { path = "crates/backend/updates" }
scenter-appimages = { path = "crates/backend/appimages" }
scenter-home      = { path = "crates/backend/home" }
